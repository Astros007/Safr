name: Safr
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
targets:
  Safr:
    type: application
    platform: iOS
    sources:
      - path: Pathfinder
        excludes: [Web]
      - path: Pathfinder/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahisnuadhikari.safr
        DEVELOPMENT_TEAM: 7Q83Y3W82Z
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Safr
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Safr uses your location to find your starting point and guide your walk or bike ride.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
